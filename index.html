<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что есть — то есть</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/assets/style/styles.css">
    <link rel="stylesheet" href="/assets/style/main.css">
</head>
<body>
<script src="/assets/code/header_footer.js" type="module"></script>

<site-header></site-header>
<main>
    <div class="generation-properties">
        <div class="sort-wrapper">
            <button class="sort-button" id="sortButton">
                <div class="sort-icon">
                    <img id="sortIcon" src="/assets/svg/expand.svg" alt="Иконка сортировки">
                </div>
                <span id="sortLabel"></span>
            </button>

            <div class="sort-menu" id="sortMenu">
                <button class="sort-option active" data-sort="relevance">По релевантности</button>
                <button class="sort-option" data-sort="time">По времени готовки</button>
            </div>
        </div>

        <div class="add-products-checkbox">
            <label for="add-products">
                <input type="checkbox" id="add-products">
                <svg class="add-products-checkmark" width="17" height="12" viewBox="0 0 17 12" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 1.00018L6 11.0002L1 6.00018" stroke="#757575" stroke-width="3" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                Докуп продуктов
            </label>
        </div>
    </div>

    <div class="recipes">
        <div class="container-title">
            <h1>Что будем готовить сегодня?</h1>
        </div>
        <div class="recipe-cards">

        </div>
    </div>
</main>
<site-footer></site-footer>
</body>
<script src="/assets/code/checkAuth.js" type="module"></script>
<script src="/assets/code/myproducts.js" type="module"></script>
<script src="/assets/code/main.js" type="module"></script>
</html>
