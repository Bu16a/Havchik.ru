<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что есть — то есть</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/style/styles.css">
    <link rel="stylesheet" href="/assets/style/profile.css">
</head>
<body>
<script src="/assets/code/header.js" type="module"></script>
<site-header></site-header>
<main>
    <div class="profile-container">
        <div class="profile-navigation">
            <button id="showAllergensBtn" class="profile-nav-btn active">Аллергены</button>
            <button id="showCookedRecipesBtn" class="profile-nav-btn">Приготовленные рецепты</button>
        </div>

        <div id="allergensContent" class="profile-content active">
            <h2>Мои аллергены</h2>
            <div class="actions">
                <button class="action-btn" id="showAddAllergenFormBtn">Добавить аллерген</button>
            </div>
            <div class="add-allergen-form" hidden>
                <h3>Добавить новый аллерген</h3>
                <div class="form-field">
                    <label for="newAllergenName">Название аллергена:</label>
                    <input type="text" id="newAllergenName" placeholder="Название аллергена">
                </div>
                <div class="form-actions">
                    <button class="form-btn save-new-btn" id="saveNewAllergenBtn">Сохранить</button>
                    <button class="form-btn cancel-new-btn" id="cancelNewAllergenBtn">Отмена</button>
                </div>
            </div>
            <div class="allergen-list">
                <p><em></em></p>
            </div>
        </div>

        <div id="cookedRecipesContent" class="profile-content">
            <h2>Приготовленные рецепты</h2>
            <div class="cooked-recipes-list">
                <p><em></em></p>
            </div>
        </div>
    </div>

    <form>
        <button type="submit" id="logOut"><strong>Выйти из аккаунта</strong></button>
    </form>
</main>
<script src="/assets/code/header_footer.js" type="module"></script>
<script src="assets/code/profile.js" type="module"></script>
<script src="/assets/code/checkAuth.js" type="module"></script>
</body>
</html>
